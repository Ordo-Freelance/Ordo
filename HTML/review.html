<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تقييم الخدمة</title>
<link href="../Assets/vendor/fonts/offline-fonts.css" rel="stylesheet">
<script src="../JavaScript/config.js?v=vercel-1"></script>
<script src="../JavaScript/vercel_backend.js?v=1"></script>
<script src="../JavaScript/ordo_public_core.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0d14;
  --surface:#13161f;
  --surface2:#1a1e2b;
  --border:rgba(255,255,255,.08);
  --t1:#f0f2f8;
  --t2:#9aa3bc;
  --t3:#5a6380;
  --ac:#4fd1a5;
  --ac2:#7c6ff7;
  --gold:#f7c948;
  --danger:#f76f7c;
  --font:'Cairo',sans-serif;
}
body{
  background:var(--bg);
  color:var(--t1);
  font-family:var(--font);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:24px 16px 60px;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(79,209,165,.12) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 80%, rgba(124,111,247,.08) 0%, transparent 60%);
}

/* ── Loader ── */
#loader{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  z-index:999;transition:opacity .4s;
}
#loader.hide{opacity:0;pointer-events:none;}
.spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Card ── */
.card{
  width:100%;max-width:480px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px 24px;
  margin-bottom:16px;
  animation:fadeUp .5s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ── Header ── */
.header-card{
  text-align:center;
  padding:32px 24px 24px;
  border-bottom:none;
  position:relative;
  overflow:hidden;
}
.header-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 100% 80% at 50% 100%, color-mix(in srgb,var(--ac) 7%,transparent) 0%, transparent 70%);
  pointer-events:none;
}
.freelancer-avatar{
  max-width:200px;max-height:100px;width:auto;height:auto;border-radius:0;
  border:0;
  object-fit:contain;
  margin:0 auto 12px;
  display:block;
  background:transparent;
}
.avatar-placeholder{
  width:72px;height:72px;border-radius:50%;
  border:3px solid var(--ac);
  background:linear-gradient(135deg,var(--ac2),var(--ac));
  display:flex;align-items:center;justify-content:center;
  font-size:28px;
  margin:0 auto 12px;
}
.freelancer-name{font-size:20px;font-weight:900;color:var(--t1);margin-bottom:4px;}
.freelancer-title{font-size:13px;color:var(--t2);}
.badge-verified{
  display:inline-flex;align-items:center;gap:4px;
  background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);
  border:1px solid color-mix(in srgb,var(--ac) 25%,transparent);
  border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;
  margin-top:8px;
}

/* ── Section title ── */
.sec-title{
  font-size:12px;font-weight:700;color:var(--t3);
  letter-spacing:.8px;text-transform:uppercase;
  margin-bottom:14px;
}

/* ── Name input ── */
.inp-wrap{margin-bottom:14px;}
.inp-label{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:6px;display:block;}
.inp{
  width:100%;background:var(--surface2);
  border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;color:var(--t1);
  font-family:var(--font);font-size:14px;
  outline:none;transition:border .2s;
}
.inp:focus{border-color:var(--ac2);}
.inp::placeholder{color:var(--t3);}

/* ── Stars ── */
.stars-wrap{
  display:flex;justify-content:center;gap:10px;
  margin:8px 0 16px;
}
.star{
  font-size:38px;cursor:pointer;
  filter:grayscale(1) opacity(.3);
  transition:transform .15s,filter .15s;
  user-select:none;
}
.star:hover,.star.active{filter:none;transform:scale(1.15);}
.star-label{
  text-align:center;font-size:13px;color:var(--t2);
  height:18px;margin-bottom:12px;transition:color .2s;
}

/* ── Comment ── */
.textarea{
  width:100%;background:var(--surface2);
  border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;color:var(--t1);
  font-family:var(--font);font-size:13px;
  outline:none;transition:border .2s;
  resize:none;min-height:90px;
  line-height:1.6;
}
.textarea:focus{border-color:var(--ac2);}
.textarea::placeholder{color:var(--t3);}

/* ── Submit btn ── */
.btn-submit{
  width:100%;padding:14px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  color:#0a0d14;border:none;border-radius:12px;
  font-family:var(--font);font-size:15px;font-weight:900;
  cursor:pointer;transition:opacity .2s,transform .1s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:4px;
}
.btn-submit:disabled{opacity:.45;cursor:not-allowed;}
.btn-submit:not(:disabled):hover{opacity:.9;}
.btn-submit:not(:disabled):active{transform:scale(.98);}

/* ── Error / Success ── */
#err-box{
  background:rgba(247,111,124,.1);border:1px solid rgba(247,111,124,.3);
  border-radius:12px;padding:14px 16px;
  color:var(--danger);font-size:13px;font-weight:600;
  text-align:center;margin-bottom:16px;
  display:none;animation:fadeUp .3s ease both;
}
#success-card{
  width:100%;max-width:480px;
  background:var(--surface);border:1px solid color-mix(in srgb,var(--ac) 30%,transparent);
  border-radius:20px;padding:40px 24px;
  text-align:center;display:none;
  animation:fadeUp .5s ease both;
}

/* ── Footer ── */
.footer{
  margin-top:24px;text-align:center;
  font-size:11px;color:var(--t3);
}
.footer a{color:var(--ac);text-decoration:none;}

/* ── Char counter ── */
.char-count{font-size:11px;color:var(--t3);text-align:left;margin-top:4px;}
</style>
</head>
<body>

<div id="loader"><div class="spin"></div></div>

<!-- Error Box -->
<div id="err-box"></div>

<!-- Header Card -->
<div class="card header-card" id="header-card" style="display:none">
  <div id="avatar-wrap"><div class="avatar-placeholder">⭐</div></div>
  <div class="freelancer-name" id="fl-name">فريلانسر</div>
  <div class="freelancer-title" id="fl-title">خدمات إبداعية</div>
  <div class="badge-verified"><span>✓</span> تقييم موثّق</div>
</div>

<!-- Review Form Card -->
<div class="card" id="form-card" style="display:none;animation-delay:.1s">
  <div class="sec-title">✍️ اترك تقييمك</div>

  <!-- Name -->
  <div class="inp-wrap">
    <label class="inp-label" for="rev-name">اسمك *</label>
    <input class="inp" id="rev-name" placeholder="مثال: محمد أحمد" maxlength="60" autocomplete="name">
  </div>

  <!-- Stars -->
  <div class="inp-label" style="margin-bottom:8px">تقييمك من 5 نجوم *</div>
  <div class="stars-wrap" id="stars-wrap">
    <span class="star" data-v="5">⭐</span>
    <span class="star" data-v="4">⭐</span>
    <span class="star" data-v="3">⭐</span>
    <span class="star" data-v="2">⭐</span>
    <span class="star" data-v="1">⭐</span>
  </div>
  <div class="star-label" id="star-label">اختر عدد النجوم</div>

  <!-- Comment -->
  <div class="inp-wrap">
    <label class="inp-label" for="rev-comment">تعليقك (اختياري)</label>
    <textarea class="textarea" id="rev-comment" placeholder="شاركنا تجربتك مع الخدمة..." maxlength="500" oninput="document.getElementById('char-cnt').textContent=this.value.length+'/500'"></textarea>
    <div class="char-count" id="char-cnt">0/500</div>
  </div>

  <button class="btn-submit" id="submit-btn" onclick="submitReview()" disabled>
    <span>⭐</span> إرسال التقييم
  </button>
</div>

<!-- Success Card -->
<div id="success-card">
  <div style="font-size:60px;margin-bottom:16px">🎉</div>
  <div style="font-size:22px;font-weight:900;color:var(--ac);margin-bottom:8px">شكراً على تقييمك!</div>
  <div style="font-size:14px;color:var(--t2);line-height:1.8;margin-bottom:16px">رأيك يساعد على التحسين المستمر ✨</div>
  <div id="success-stars" style="font-size:32px;margin-bottom:8px"></div>
  <div id="success-comment" style="font-size:13px;color:var(--t2);font-style:italic;margin-top:8px"></div>
</div>

<div class="footer" id="page-footer" style="display:none">
  مدعوم بواسطة <a href="#" target="_blank">Ordo</a>
</div>

<script>
const ORDO_SUPABASE_CONFIG = window.ORDO_CONFIG || {};
if (!ORDO_SUPABASE_CONFIG.SUPA_URL || !ORDO_SUPABASE_CONFIG.SUPA_ANON || ORDO_SUPABASE_CONFIG.SUPA_ANON === 'PUT_LOCAL_ANON_KEY_HERE') {
  console.info('[Ordo] Running with Ordo Vercel backend.');
}
const SUPA_URL=ORDO_SUPABASE_CONFIG.SUPA_URL || '';
const SUPA_ANON=ORDO_SUPABASE_CONFIG.SUPA_ANON || '';
const db=supabase.createClient(SUPA_URL,SUPA_ANON);

const P=new URLSearchParams(location.search);
const pUid=P.get('uid');
const pUsername=P.get('u');
const _reviewPathMatch=location.pathname.match(/^\/review\/([^/?#]+)\/?$/i);
const pPublicToken=P.get('token')||P.get('public_token')||P.get('t')||(_reviewPathMatch?decodeURIComponent(_reviewPathMatch[1]):'');
let _resolvedUid=null;
let _reviewTokenObj=null;
let _ud=null;
let _selectedStars=0;

const starLabels=['','ضعيف جداً 😞','ضعيف 😕','مقبول 😐','جيد 😊','ممتاز! 🤩'];

// ── Stars Logic ──
document.querySelectorAll('.star').forEach(s=>{
  s.addEventListener('click',()=>{
    _selectedStars=+s.dataset.v;
    document.querySelectorAll('.star').forEach((st,idx)=>{
      // Stars are in reverse order (5,4,3,2,1)
      const v=+st.dataset.v;
      st.classList.toggle('active',v<=_selectedStars);
    });
    document.getElementById('star-label').textContent=starLabels[_selectedStars]||'';
    checkForm();
  });
  s.addEventListener('mouseenter',()=>{
    const hv=+s.dataset.v;
    document.querySelectorAll('.star').forEach(st=>{
      st.style.filter=+st.dataset.v<=hv?'none':'grayscale(1) opacity(.3)';
    });
  });
  s.addEventListener('mouseleave',()=>{
    document.querySelectorAll('.star').forEach(st=>{
      st.style.filter='';
      st.classList.toggle('active',+st.dataset.v<=_selectedStars);
    });
  });
});

document.getElementById('rev-name').addEventListener('input',checkForm);

function checkForm(){
  const name=(document.getElementById('rev-name').value||'').trim();
  const btn=document.getElementById('submit-btn');
  btn.disabled=!name||!_selectedStars;
}

function showErr(msg){
  const el=document.getElementById('err-box');
  el.textContent=msg;el.style.display='block';
  document.getElementById('loader').classList.add('hide');
}

function applyReviewIdentity(s){
  const accent=s.accentColor||s.accent||s.theme_color||'#7c6ff7';
  const secondary=s.accentColor2||s.accent2||accent;
  document.documentElement.style.setProperty('--ac',accent);
  document.documentElement.style.setProperty('--ac2',secondary);
  const light=(s.displayMode||s.display_mode||'dark')==='light';
  document.documentElement.style.setProperty('--bg',light?'#f4f6fa':'#0a0d14');
  document.documentElement.style.setProperty('--surface',light?'#ffffff':'#13161f');
  document.documentElement.style.setProperty('--surface2',light?'#f0f1f8':'#1a1e2b');
  document.documentElement.style.setProperty('--border',light?'rgba(0,0,0,.08)':'rgba(255,255,255,.08)');
  document.documentElement.style.setProperty('--t1',light?'#1a1a2e':'#f0f2f8');
  document.documentElement.style.setProperty('--t2',light?'#444466':'#9aa3bc');
  document.documentElement.style.setProperty('--t3',light?'#888899':'#5a6380');
  document.body.style.backgroundColor='var(--bg)';
  document.body.style.color='var(--t1)';
  document.body.style.backgroundImage=`radial-gradient(ellipse 80% 50% at 50% -10%, color-mix(in srgb, ${accent} ${light?'7':'12'}%, transparent) 0%, transparent 60%), radial-gradient(ellipse 50% 40% at 80% 80%, color-mix(in srgb, ${secondary} ${light?'5':'8'}%, transparent) 0%, transparent 60%)`;
}

// ── Boot ──
async function boot(){
  try{
    if(pPublicToken&&window.OrdoPublic){
      const resolved=await OrdoPublic.resolvePublicToken(db,pPublicToken,{uid:pUid,entity_type:'review'});
      if(!resolved.ok){showErr('رابط التقييم غير صالح أو منتهي');return;}
      if(resolved.token.used_at&&!resolved.token.allow_multiple){showErr('تم استخدام رابط التقييم من قبل');return;}
      _resolvedUid=resolved.uid;
      _reviewTokenObj=resolved.token;
      _ud=resolved.data;
      const s=_ud?.settings||{};
      document.getElementById('fl-name').textContent=s.name||s.username||'فريلانسر';
      document.getElementById('fl-title').textContent=s.bio||s.title||'خدمات إبداعية متميزة';
      document.title=(s.name||s.username||'فريلانسر')+' — تقييم الخدمة';
      applyReviewIdentity(s);
      document.getElementById('loader').classList.add('hide');
      document.getElementById('header-card').style.display='';
      document.getElementById('form-card').style.display='';
      document.getElementById('page-footer').style.display='';
      return;
    }
    let uid=pUid;

    // Resolve username → uid
    if(!uid && pUsername){
      // Strategy 1: Direct username_index column (fastest & most reliable)
      const r1 = await db.from('studio_data')
        .select('user_id')
        .eq('username_index', pUsername)
        .maybeSingle();
      if(r1.data?.user_id) uid = r1.data.user_id;

      // Strategy 2: Case-insensitive username_index
      if(!uid){
        const r2 = await db.from('studio_data')
          .select('user_id')
          .ilike('username_index', pUsername)
          .maybeSingle();
        if(r2.data?.user_id) uid = r2.data.user_id;
      }

      if(!uid){
        console.warn('[Review] Skipped JSON text search across studio_data. Use username_index or public token links.');
      }

      if(!uid){ showErr('لم يتم العثور على الحساب — تأكد من الرابط أو اطلب رابطاً جديداً من الفريلانسر'); return; }
    }

    if(!uid){showErr('رابط التقييم غير صالح — يرجى طلب رابط جديد من الفريلانسر');return;}
    _resolvedUid=uid;

    // Fetch data
    const{data:row,error}=await db.from('studio_data').select('data').eq('user_id',uid).maybeSingle();
    if(error||!row){showErr('حدث خطأ في التحميل، حاول مجدداً');return;}

    let ud=row.data;
    if(typeof ud==='string') ud=JSON.parse(ud);
    if(ud?.data&&!ud?.tasks) ud=typeof ud.data==='string'?JSON.parse(ud.data):ud.data;
    _ud=ud;

    // Show freelancer info
    const s=ud?.settings||{};
    
    applyReviewIdentity(s);
    if(s.logo){
      document.getElementById('avatar-wrap').innerHTML=`<img class="freelancer-avatar" src="${s.logo}" onerror="this.style.display='none'">`;
    }
    document.getElementById('fl-name').textContent=s.name||s.username||'فريلانسر';
    document.getElementById('fl-title').textContent=s.bio||s.title||'خدمات إبداعية متميزة';

    // Apply user identity (title, favicon)
    var _revUserName = s.name||s.username||'فريلانسر';
    document.title = _revUserName + ' — تقييم الخدمة';
    try{
      if(s.logo){
        var _favLink = document.querySelector("link[rel*='icon']");
        if(!_favLink){ _favLink=document.createElement('link'); _favLink.rel='icon'; document.head.appendChild(_favLink); }
        _favLink.href = s.logo;
      }
    }catch(e){}

    // Show UI
    document.getElementById('header-card').style.display='';
    document.getElementById('form-card').style.display='';
    document.getElementById('page-footer').style.display='';
    document.getElementById('loader').classList.add('hide');

  }catch(e){
    console.error(e);
    showErr('حدث خطأ غير متوقع، حاول مجدداً');
  }
}

// ── Submit ──
async function submitReview(){
  const name=(document.getElementById('rev-name').value||'').trim();
  const comment=(document.getElementById('rev-comment').value||'').trim();
  if(!name||!_selectedStars){return;}

  const btn=document.getElementById('submit-btn');
  btn.disabled=true;
  btn.innerHTML='<span class="spin" style="width:18px;height:18px;border-width:2px"></span> جاري الإرسال...';

  const review={
    id:'rev_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    task_id:_reviewTokenObj&&_reviewTokenObj.entity_type==='task'?_reviewTokenObj.entity_id:null, task_title:'تقييم عام',
    client_id:_reviewTokenObj?_reviewTokenObj.client_id:null, client_name:name,
    project_id:_reviewTokenObj&&_reviewTokenObj.project_id?_reviewTokenObj.project_id:null,
    stars:_selectedStars, rating:_selectedStars, comment:comment, text:comment,
    public_visible:true,
    created_at:new Date().toISOString(), source:'review_form',
    source_type:_reviewTokenObj?_reviewTokenObj.entity_type:'review_form',
    source_id:_reviewTokenObj?_reviewTokenObj.entity_id:null,
    token:_reviewTokenObj?_reviewTokenObj.token:null
  };
  if(window.OrdoPublic) OrdoPublic.normalizeReview(review,_reviewTokenObj);

  let saved=false;

  // Save through the public API, which validates the review link.
  try{
    const queued=await ORDO_API_REQUEST('public.review.submit',{type:'review',token:pPublicToken,review:review});
    saved=!!queued.data;
  }catch(e){ console.warn('Review save failed',e); }

  if(!saved){
    btn.disabled=false;
    btn.textContent='إرسال التقييم';
    showErr('تعذر إرسال التقييم. حاول مرة أخرى.');
    return;
  }

  document.getElementById('header-card').style.display='none';
  document.getElementById('form-card').style.display='none';
  showSuccessCard(_selectedStars, comment, false);
}



function showSuccessCard(stars, comment, isDup){
  const sc=document.getElementById('success-card');
  if(isDup){
    sc.querySelector('div:nth-child(2)').style.color='var(--gold)';
    sc.querySelector('div:nth-child(2)').textContent='قيّمت من قبل ⭐';
    sc.querySelector('div:nth-child(3)').textContent='لقد أرسلت تقييماً سابقاً، شكراً لك!';
  }
  document.getElementById('success-stars').textContent='⭐'.repeat(stars);
  document.getElementById('success-comment').textContent=comment?`"${comment}"`:'';
  sc.style.display='block';
}

boot();
</script>
<link rel="stylesheet" href="../CSS/cairo_global_fix.css?v=1">
<script src="../JavaScript/text_repair.js?v=1"></script>
</body>
</html>
