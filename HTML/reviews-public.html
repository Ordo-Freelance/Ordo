    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0a0a0f;
        --s1: #111118;
        --s2: #16161f;
        --s3: #1c1c28;
        --t1: #f0f0f5;
        --t2: #aaaacc;
        --t3: #777799;
        --ac: #7c6ff7;
        --ac2: #4fd1a5;
        --gold: #f7c948;
        --bd: rgba(255, 255, 255, 0.08);
        --font: "Cairo", sans-serif;
      }
      body {
        background: var(--bg);
        color: var(--t1);
        font-family: var(--font);
        min-height: 100vh;
        overflow-x: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse 70% 50% at 20% 0%,
            color-mix(in srgb, var(--ac) 12%, transparent),
            transparent 60%
          ),
          radial-gradient(
            ellipse 50% 40% at 80% 100%,
            rgba(247, 201, 72, 0.06),
            transparent 60%
          );
      }
      #loader {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999;
      }
      .spin {
        width: 36px;
        height: 36px;
        border: 3px solid var(--bd);
        border-top-color: var(--ac);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #err-screen {
        display: none;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        padding: 40px;
      }
      .nav {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(10, 10, 15, 0.88);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--bd);
        padding: 0 20px;
      }
      .nav-in {
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        height: 60px;
        gap: 12px;
      }
      .nav-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        flex: 1;
        min-width: 0;
      }
      .nav-av {
        max-width: 90px;
        max-height: 44px;
        width: auto;
        height: auto;
        border-radius: 0;
        object-fit: contain;
        flex-shrink: 0;
      }
      .nav-av-ph {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--ac), var(--ac2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        color: #fff;
        font-weight: 900;
        flex-shrink: 0;
      }
      .nav-nm {
        font-size: 15px;
        font-weight: 900;
        color: var(--t1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nb {
        padding: 7px 16px;
        border-radius: 9px;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        font-family: var(--font);
        border: none;
        transition: 0.15s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .nb-s {
        background: var(--ac);
        color: #fff;
      }
      .nb-s:hover {
        opacity: 0.85;
      }
      .nb-w {
        background: #25d366;
        color: #fff;
      }
      .nb-w:hover {
        opacity: 0.85;
      }
      .hero {
        text-align: center;
        padding: 48px 20px 36px;
        position: relative;
        z-index: 1;
      }
      .h-av {
        max-width: 200px;
        max-height: 100px;
        width: auto;
        height: auto;
        border: 0;
        border-radius: 0;
        object-fit: contain;
        margin: 0 auto 14px;
        display: block;
        background: transparent;
      }
      .h-av-ph {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 3px solid var(--ac);
        background: linear-gradient(135deg, var(--ac), var(--ac2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        color: #fff;
        margin: 0 auto 14px;
      }
      .h-nm {
        font-size: 24px;
        font-weight: 900;
      }
      .h-bio {
        font-size: 13px;
        color: var(--t2);
        margin-top: 4px;
        max-width: 400px;
        margin-left: auto;
        margin-right: auto;
        line-height: 1.7;
      }
      .sw {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 20px;
        position: relative;
        z-index: 1;
      }
      .sc {
        display: flex;
        align-items: center;
        gap: 24px;
        background: var(--s1);
        border: 1px solid var(--bd);
        border-radius: 20px;
        padding: 28px 32px;
        margin-bottom: 24px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .sc-n {
        font-size: 64px;
        font-weight: 900;
        color: var(--gold);
        line-height: 1;
      }
      .sc-s {
        font-size: 24px;
        margin: 8px 0 2px;
      }
      .sc-c {
        font-size: 12px;
        color: var(--t3);
      }
      .sd {
        flex: 1;
        min-width: 200px;
      }
      .dr {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .db {
        flex: 1;
        height: 8px;
        background: var(--s3);
        border-radius: 4px;
        overflow: hidden;
      }
      .df {
        height: 100%;
        background: var(--gold);
        border-radius: 4px;
        transition: width 0.8s ease;
      }
      .ct {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 20px 40px;
        position: relative;
        z-index: 1;
      }
      .rg {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 14px;
        margin-bottom: 32px;
      }
      @media (max-width: 720px) {
        .rg {
          grid-template-columns: 1fr;
        }
      }
      .rc {
        background: var(--s1);
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 18px 20px;
        border-right: 3px solid var(--gold);
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      .rc:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 32px color-mix(in srgb, var(--ac) 10%, transparent);
      }
      .rcm {
        font-size: 12px;
        color: var(--t2);
        line-height: 1.8;
        font-style: italic;
        padding: 12px 14px;
        background: var(--s2);
        border-radius: 10px;
        border-right: 3px solid var(--gold);
        margin-top: 10px;
      }
      .ft {
        background: var(--s2);
        border-top: 1px solid var(--bd);
        padding: 32px 20px;
        text-align: center;
        position: relative;
        z-index: 1;
      }
      .fl {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .fla {
        padding: 8px 18px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        font-family: var(--font);
        border: 1.5px solid var(--bd);
        background: transparent;
        color: var(--t2);
        transition: 0.15s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .fla:hover {
        background: var(--ac);
        color: #fff;
        border-color: var(--ac);
      }
      .oc {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 28px;
        background: linear-gradient(135deg, var(--ac), var(--ac2));
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 900;
        cursor: pointer;
        font-family: var(--font);
        transition: 0.2s;
        text-decoration: none;
      }
      .oc:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px color-mix(in srgb, var(--ac) 30%, transparent);
      }
      body.light {
        --bg: #f4f5fb;
        --s1: #fff;
        --s2: #f0f1f8;
        --s3: #e8e9f4;
        --t1: #1a1a2e;
        --t2: #555577;
        --t3: #888899;
        --bd: rgba(0, 0, 0, 0.08);
      }
      body.light {
        background: var(--bg);
        color: var(--t1);
      }
      body.light::before {
        background:
          radial-gradient(
            ellipse 70% 50% at 20% 0%,
            color-mix(in srgb, var(--ac) 6%, transparent),
            transparent 60%
          ),
          radial-gradient(
            ellipse 50% 40% at 80% 100%,
            rgba(247, 201, 72, 0.04),
            transparent 60%
          );
      }
      body.light .nav {
        background: rgba(255, 255, 255, 0.9);
      }
      @media (max-width: 500px) {
        .hero {
          padding: 32px 16px 24px;
        }
        .sc-n {
          font-size: 48px;
        }
        .sc {
          padding: 20px;
          gap: 16px;
        }
        .rg {
          grid-template-columns: 1fr;
        }
      }
      /* Keep public reviews inside the same living storefront identity. */
      .nav-in{max-width:1100px;height:68px}.nav-links{display:flex;align-items:center;gap:3px;margin-right:auto}.nav-link{color:var(--t2);text-decoration:none;font-size:13px;font-weight:750;padding:8px 12px;border-radius:9px;transition:.18s;white-space:nowrap}.nav-link:hover,.nav-link.active{color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}.nav-toggle{display:none;width:38px;height:38px;border:1px solid var(--bd);border-radius:10px;background:var(--s2);color:var(--t1);font-size:17px;cursor:pointer}.mobile-nav{display:none;position:fixed;top:68px;right:0;left:0;z-index:99;padding:10px 16px 15px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--bd)}.mobile-nav.open{display:grid;gap:4px}.mobile-nav .nav-link{display:flex;align-items:center;gap:9px;padding:11px 13px}
      .hero{padding:28px 20px 20px}.hero-shell{max-width:1060px;margin:0 auto;min-height:245px;border:1px solid var(--bd);border-radius:22px;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 7%,var(--s1)),var(--s1));display:grid;grid-template-columns:minmax(0,1.45fr) minmax(230px,.55fr);position:relative}.hero-copy{padding:40px 46px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:right;position:relative;z-index:1}.hero-title{font-size:clamp(25px,3vw,36px);font-weight:900;line-height:1.4}.h-bio{margin:8px 0 0;max-width:560px;font-size:13px;text-align:right}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.hero-btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border-radius:10px;padding:9px 15px;font-size:12px;font-weight:800;transition:.18s}.hero-btn.primary{background:var(--ac);color:#fff}.hero-btn.secondary{border:1px solid var(--bd);background:transparent;color:var(--t1)}.hero-btn:hover{transform:translateY(-1px)}.hero-brand{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;border-right:1px solid var(--bd);background:color-mix(in srgb,var(--s2) 36%,transparent);position:relative;z-index:1}.hero-brand .h-nm{margin-top:8px;font-size:17px}
      .reviews-wrap{max-width:1060px;margin:0 auto;padding:8px 20px 70px;position:relative;z-index:1}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:24px 0 16px}.section-title{font-size:21px;font-weight:900;display:flex;gap:10px;align-items:center}.reviews-wrap .sc{margin:0 0 30px;padding:20px 24px;justify-content:flex-start}.reviews-wrap .sc-n{font-size:44px}.reviews-wrap .rg{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}.reviews-wrap .rc{padding:20px;border-radius:17px;box-shadow:none}
      .ft{padding:42px 20px 26px}.footer-in{max-width:1100px;margin:0 auto}.footer-brand-row{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}.footer-brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:900}.footer-bottom{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--bd);padding-top:18px;margin-top:22px;font-size:11px;color:var(--t3)}
      @media(max-width:820px){.nav-links{display:none}.nav-toggle{display:inline-flex;align-items:center;justify-content:center}.nav-nm{display:none}.nb{padding:8px 11px}.hero-shell{grid-template-columns:1fr}.hero-copy{padding:32px 28px;order:2}.hero-brand{border-right:0;border-bottom:1px solid var(--bd);padding:24px}.hero-brand .h-av{max-height:68px}.hero{padding:20px 14px 16px}.reviews-wrap{padding:6px 14px 55px}.section-head{align-items:flex-start;flex-direction:column}.reviews-wrap .rg{grid-template-columns:1fr}}
      @media(max-width:480px){.hero-copy{padding:32px 22px}.hero-title{font-size:29px}.hero-actions{width:100%}.hero-btn{flex:1;justify-content:center;padding:10px 12px}.nb-w{display:none}.reviews-wrap .sc{padding:18px;align-items:flex-start}.footer-brand-row{align-items:flex-start}}
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="spin"></div>

    <script>
      var ORDO_SUPABASE_CONFIG = window.ORDO_CONFIG || {};
      if (!ORDO_SUPABASE_CONFIG.SUPA_URL || !ORDO_SUPABASE_CONFIG.SUPA_ANON || ORDO_SUPABASE_CONFIG.SUPA_ANON === "PUT_LOCAL_ANON_KEY_HERE") {
        console.info("[Ordo] Running with Ordo Vercel backend.");
      }
      var SUPA_URL = ORDO_SUPABASE_CONFIG.SUPA_URL || "",
        SUPA_ANON = ORDO_SUPABASE_CONFIG.SUPA_ANON || "";
      var db = supabase.createClient(SUPA_URL, SUPA_ANON),
        P = new URLSearchParams(location.search),
        pUid = P.get("uid") || "",
        pU = P.get("u") || P.get("user") || ((location.pathname.match(/^\/reviews\/([^/?#]+)\/?$/i)||[])[1] ? decodeURIComponent((location.pathname.match(/^\/reviews\/([^/?#]+)\/?$/i)||[])[1]) : ""),
        pToken = P.get("token") || P.get("public_token") || P.get("t") || "";
      var BASE =
        window.location.origin +
        window.location.pathname.replace(/\/[^\/]*$/, "/");
      function xe(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function $(id) {
        return document.getElementById(id);
      }
      function showErr(t, s) {
        $("loader").style.display = "none";
        $("main-content").style.display = "none";
        $("err-title").textContent = t;
        $("err-sub").textContent = s || "";
        $("err-screen").style.display = "flex";
      }
      async function boot() {
        var tokenResolved = null;
        if (pToken && window.OrdoPublic) {
          try {
            tokenResolved = await window.OrdoPublic.resolvePublicToken(db, pToken, {
              uid: pUid || "",
              entity_type: "reviews_public"
            });
          } catch (e) {
            showErr("رابط غير صالح", "token");
            return;
          }
          if (!tokenResolved || !tokenResolved.ok) {
            showErr("رابط غير صالح", tokenResolved && tokenResolved.reason ? tokenResolved.reason : "token");
            return;
          }
          pUid = tokenResolved.uid || pUid;
        }
        if (!pUid && !pU) {
          showErr("رابط غير صحيح", "لا يوجد معرف في الرابط");
          return;
        }
        try {
          var uid = pUid;
          if (!uid && pU) {
            if (window.ORDO_API_REQUEST) {
              try {
                var publicSnapshot = (await ORDO_API_REQUEST('public.snapshot', {type:'reviews_public', username:pU.toLowerCase()})).data;
                if (publicSnapshot) { uid = publicSnapshot.uid; tokenResolved = {data:publicSnapshot.data}; }
              } catch (e) { console.warn('[Reviews] Public lookup failed:', e.message); }
            }
          }
          if (!uid && pU) {
            try {
              var r1 = await db
                .from("studio_data")
                .select("user_id")
                .ilike("username_index", pU.toLowerCase())
                .maybeSingle();
              if (r1.data) uid = r1.data.user_id;
            } catch (e) {}
            if (!uid) console.warn("[Reviews] Skipped JSON text search across studio_data. Use username_index or public token links.");
          }
          if (!uid) {
            showErr("لم يتم العثور على الحساب", "تأكد من صحة الرابط");
            return;
          }
          var ud = tokenResolved && tokenResolved.data ? tokenResolved.data : null;
          if (!ud && window.ORDO_API_REQUEST) {
            try { ud = (await ORDO_API_REQUEST('public.snapshot', {type:'reviews_public', uid:uid})).data.data; }
            catch (e) { console.warn('[Reviews] Public data unavailable:', e.message); }
          }
          if (!ud) {
          var res = await db
            .from("studio_data")
            .select("data")
            .eq("user_id", uid)
            .maybeSingle();
          if (!res.data) {
            showErr("خطأ في التحميل", "");
            return;
          }
          ud = res.data.data;
          if (typeof ud === "string") ud = JSON.parse(ud);
          if (ud && ud.data && !ud.tasks)
            ud = typeof ud.data === "string" ? JSON.parse(ud.data) : ud.data;
          }
          var s = ud.settings || {},
            reviews = (ud.reviews || []).filter(function(r){ return r && r.public_visible !== false; }).sort(function (a, b) {
              return new Date(b.created_at || 0) - new Date(a.created_at || 0);
            }),
            ac = s.accentColor || s.accent || s.theme_color || "#7c6ff7",
            ac2 = s.accentColor2 || s.accent2 || ac,
            isL = (s.displayMode || s.display_mode || "dark") === "light",
            nm = s.name || s.username || "فريلانسر",
            bio = s.bio || s.title || "",
            logo = isL ? (s.logoDark || s.logo || s.logoLight || "") : (s.logoLight || s.logo || s.logoDark || ""),
            phone = s.phone || "",
            websiteUrl = /^https?:\/\//i.test(s.public_website_url || "") ? s.public_website_url : "",
            un = s.username || s.store_slug || "";
          document.documentElement.style.setProperty("--ac", ac);
          document.documentElement.style.setProperty("--ac2", ac2);
          if (isL) document.body.classList.add("light");
          window.applyOrdoPublicAppearance(s);
          // The shared appearance tone is useful for decorative pages, but it
          // must not replace the contrast palette of the reviews dashboard.
          // Restore the semantic review colours after loading owner identity.
          // applyOrdoPublicAppearance writes the tone variables on both html
          // and body.  Reset both scopes; otherwise the body-scoped value wins
          // inheritance and leaves this page under the old grey tone.
          [document.documentElement.style,document.body.style].forEach(function(reviewStyle){
            reviewStyle.setProperty("--bg",isL?"#f4f5fb":"#0a0a0f");
            reviewStyle.setProperty("--s1",isL?"#ffffff":"#111118");
            reviewStyle.setProperty("--s2",isL?"#f0f1f8":"#16161f");
            reviewStyle.setProperty("--s3",isL?"#e8e9f4":"#1c1c28");
            reviewStyle.setProperty("--surface",isL?"#ffffff":"#111118");
            reviewStyle.setProperty("--surface2",isL?"#f0f1f8":"#16161f");
            reviewStyle.setProperty("--t1",isL?"#1a1a2e":"#f0f0f5");
            reviewStyle.setProperty("--t2",isL?"#555577":"#aaaacc");
            reviewStyle.setProperty("--t3",isL?"#888899":"#777799");
            reviewStyle.setProperty("--public-page-bg",isL?"#f4f5fb":"#0a0a0f");
            reviewStyle.setProperty("--public-surface",isL?"#ffffff":"#111118");
          });
          document.title = nm + " — تقييمات العملاء";
          $("fy").textContent = new Date().getFullYear();
          var storeUrl = (location.protocol !== "file:" ? location.origin + "/store" : BASE + "store.html") + "?uid=" + encodeURIComponent(uid);
          var storeToken = (ud.public_tokens || []).find(function(t){ return t && t.entity_type === "store" && !t.revoked; });
          if (storeToken && storeToken.token) storeUrl += (storeUrl.indexOf("?") >= 0 ? "&" : "?") + "token=" + encodeURIComponent(storeToken.token);
          var reviewToken = (ud.public_tokens || []).find(function(t){ return t && t.entity_type === "review" && !t.revoked; });
          var reviewUrl = reviewToken && reviewToken.token
            ? location.origin + "/review/" + encodeURIComponent(reviewToken.token)
            : "";
          var storeHome = storeUrl + "#_hero",
            storeServices = storeUrl + "#_combo",
            storeWork = storeUrl + "#_pf";
          ["nav-home","mob-home"].forEach(function(id){ if($(id)) $(id).href=storeHome; });
          ["nav-services","mob-services"].forEach(function(id){ if($(id)) $(id).href=storeServices; });
          ["nav-work","mob-work"].forEach(function(id){ if($(id)) $(id).href=storeWork; });
          if (websiteUrl) $("hero-website").href = websiteUrl;
          else $("hero-website").style.display = "none";
          if (reviewUrl) $("hero-review").href = reviewUrl;
          else $("hero-review").style.display = "none";
          try {
            if (logo) {
              var fav = document.querySelector("link[rel*='icon']");
              if (!fav) {
                fav = document.createElement("link");
                fav.rel = "icon";
                document.head.appendChild(fav);
              }
              fav.href = logo;
            }
          } catch (e) {}
          $("nb-nm").textContent = nm;
          $("nb-link").href = storeUrl;
          if (logo)
            $("nb-av").innerHTML =
              '<img class="nav-av" src="' +
              xe(logo) +
              '" onerror="this.style.display=\'none\'">';
          var na =
            '<a href="' +
            xe(storeUrl) +
            '" class="nb nb-s"><i class="fa-solid fa-store"></i> المتجر</a>';
          if (phone)
            na +=
              '<a href="https://wa.me/' +
              phone.replace(/\D/g, "") +
              '" target="_blank" class="nb nb-w"><i class="fa-brands fa-whatsapp"></i></a>';
          $("nb-acts").innerHTML = na;
          $("h-nm").textContent = nm;
          $("h-bio").textContent = bio || "تقييمات وتجارب العملاء.";
          if (logo)
            $("h-av").innerHTML =
              '<img class="h-av" src="' +
              xe(logo) +
              '" onerror="this.parentElement.innerHTML=\'<div class=h-av-ph><i class=fa-solid fa-star style=font-size:28px></i></div>\'">';
          $("fn").textContent = nm;
          var fl =
            '<a href="' +
            xe(storeUrl) +
            '" class="fla"><i class="fa-solid fa-store"></i> المتجر</a>';
          fl += '<a href="' + xe(storeWork) + '" class="fla"><i class="fa-solid fa-images"></i> أعمالنا</a>';
          if (phone)
            fl +=
              '<a href="https://wa.me/' +
              phone.replace(/\D/g, "") +
              '" target="_blank" class="fla"><i class="fa-brands fa-whatsapp"></i> تواصل معنا</a>';
          if (reviewUrl) fl +=
            '<a href="' +
            xe(reviewUrl) +
            '" class="fla"><i class="fa-solid fa-pen-to-square"></i> أضف تقييمك</a>';
          $("fll").innerHTML = fl;
          if (!reviews.length) {
            $("loader").style.display = "none";
            $("main-content").style.display = "block";
            $("rg").innerHTML =
              '<div style="text-align:center;padding:60px 20px;color:var(--t3);grid-column:1/-1"><div style="font-size:52px;opacity:.25;margin-bottom:12px"><i class="fa-solid fa-star"></i></div><div style="font-size:16px;font-weight:800;color:var(--t2)">لا توجد تقييمات بعد</div></div>';
            return;
          }
          var total = reviews.length,
            avg = (
              reviews.reduce(function (sm, r) {
                return sm + (+r.stars || 0);
              }, 0) / total
            ).toFixed(1),
            dist = [5, 4, 3, 2, 1].map(function (n) {
              return {
                n: n,
                c: reviews.filter(function (r) {
                  return +r.stars === n;
                }).length,
              };
            });
          $("sn").textContent = avg;
          $("ss").textContent = "⭐".repeat(Math.round(+avg));
          $("scc").textContent = total + " تقييم من العملاء";
          $("sdd").innerHTML = dist
            .map(function (d) {
              var pct = Math.round((d.c / total) * 100);
              return (
                '<div class="dr"><div style="font-size:12px;color:var(--t3);width:16px;text-align:center;font-weight:700">' +
                d.n +
                '</div><div style="font-size:12px">⭐</div><div class="db"><div class="df" style="width:' +
                pct +
                '%"></div></div><div style="font-size:11px;color:var(--t3);width:24px;text-align:left">' +
                d.c +
                "</div></div>"
              );
            })
            .join("");
          $("rg").innerHTML = reviews
            .map(function (r) {
              var sl =
                  ["", "سيء 😞", "مقبول 😐", "جيد 🙂", "رائع 😊", "ممتاز 🤩"][
                    +r.stars
                  ] || "",
                clr =
                  +r.stars >= 4 ? "#f7c948" : +r.stars === 3 ? ac : "#f76f7c";
              return (
                '<div class="rc" style="border-right-color:' +
                clr +
                '"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:' +
                (r.comment ? "10" : "0") +
                'px"><div style="display:flex;align-items:center;gap:10px"><div style="width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex-shrink:0;background:' +
                ac +
                "18;color:" +
                ac +
                '">' +
                (r.client_name || "?")[0] +
                '</div><div><div style="font-size:13px;font-weight:800">' +
                xe(r.client_name || "عميل") +
                '</div><div style="font-size:10px;color:var(--t3)"><i class="fa-solid fa-calendar-days" style="margin-left:3px"></i>' +
                (r.created_at
                  ? new Date(r.created_at).toLocaleDateString("ar-EG", {
                      day: "numeric",
                      month: "long",
                      year: "numeric",
                    })
                  : "") +
                "</div>" +
                (r.task_title
                  ? '<div style="font-size:10px;color:var(--t3)"><i class="fa-solid fa-clipboard-list" style="color:' +
                    ac +
                    ';margin-left:3px"></i>' +
                    xe(r.task_title) +
                    "</div>"
                  : "") +
                '</div></div><div style="text-align:center"><div style="font-size:15px;letter-spacing:2px">' +
                "⭐".repeat(+r.stars || 0) +
                '</div><div style="font-size:9px;font-weight:700;color:' +
                clr +
                ';margin-top:2px">' +
                sl +
                "</div></div></div>" +
                (r.comment
                  ? '<div class="rcm" style="border-right-color:' +
                    clr +
                    '">"' +
                    xe(r.comment) +
                    '"</div>'
                  : "") +
                "</div>"
              );
            })
            .join("");
          $("loader").style.display = "none";
          $("main-content").style.display = "block";
        } catch (e) {
          console.error(e);
          showErr("خطأ في التحميل", "حاول تحديث الصفحة");
        }
      }
      boot();
    </script>
    <link rel="stylesheet" href="../CSS/cairo_global_fix.css?v=1">
    <script src="../JavaScript/text_repair.js?v=1"></script>
  </body>
</html>
