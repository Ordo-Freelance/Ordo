<script src="../JavaScript/config.js"></script><script src="../JavaScript/vercel_backend.js"></script><script src="../JavaScript/ordo_public_core.js?v=workspace-portal-1"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1425;color:#f3f6ff;font-family:Cairo,sans-serif;min-height:100vh}button{font:inherit}.top{position:sticky;top:0;z-index:5;background:rgba(13,20,37,.9);backdrop-filter:blur(15px);border-bottom:1px solid #303d59}.topin,.wrap{max-width:1180px;margin:auto}.topin{min-height:68px;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#7c6ff7,#4fd1a5);display:grid;place-items:center;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain}.muted{color:#8493b5}.wrap{padding:28px 22px 70px}.hero{background:linear-gradient(135deg,rgba(124,111,247,.15),rgba(79,209,165,.07));border:1px solid #303d59;border-radius:22px;padding:25px;margin-bottom:18px}.hero h1{margin:0 0 5px;font-size:25px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.stat,.client{background:#151e32;border:1px solid #303d59;border-radius:16px}.stat{padding:14px}.num{font-size:24px;font-weight:900}.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0}.search{flex:1;background:#151e32;border:1px solid #303d59;color:#fff;border-radius:12px;padding:12px 14px}.clients{display:grid;gap:14px}.client{overflow:hidden}.chead{padding:17px 19px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}.avatar{width:42px;height:42px;border-radius:12px;background:#22304e;display:grid;place-items:center;font-weight:900;color:#4fd1a5}.who{display:flex;align-items:center;gap:11px}.pill{padding:4px 10px;border-radius:30px;background:rgba(79,209,165,.12);color:#4fd1a5;font-size:11px;font-weight:800}.body{border-top:1px solid #303d59;padding:16px 19px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.mini{background:#1b2640;border-radius:11px;padding:11px}.mini b{display:block;font-size:17px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.section{background:#10192b;border:1px solid #283650;border-radius:13px;padding:13px}.section h3{font-size:13px;margin:0 0 10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #22304e;font-size:12px}.row:last-child{border:0}.status{font-size:10px;padding:3px 8px;border-radius:20px;background:rgba(247,201,72,.13);color:#f7c948}.done{background:rgba(79,209,165,.12);color:#4fd1a5}.empty{text-align:center;color:#8493b5;padding:60px 20px}.error{display:none}.loading{position:fixed;inset:0;background:#0d1425;display:grid;place-items:center;z-index:10}.spin{width:44px;height:44px;border:4px solid #22304e;border-top-color:#7c6ff7;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}

</style></head><body><div id="loading" class="loading"><div class="spin"></div></div><header class="top"><div class="topin"><div class="brand"><div class="logo" id="logo"><i class="fa-solid fa-people-roof"></i></div><div><b id="studio">Ordo</b><div class="muted" style="font-size:11px">متابعة المشاريع والعملاء</div></div></div><span class="pill"><i class="fa-solid fa-lock"></i> عرض آمن</span></div></header>
<main class="wrap"><section class="hero"><div class="muted" style="font-size:12px"><i class="fa-solid fa-id-card"></i> بوابة العملاء</div><h1 id="title">بوابة متابعة الأعمال</h1><div class="muted">مرحباً بك، تابع العملاء والمشاريع والمهام والحالة المالية من مكان واحد.</div><div class="stats"><div class="stat"><div class="muted"><i class="fa-solid fa-users"></i> العملاء</div><div class="num" id="sClients">0</div></div><div class="stat"><div class="muted"><i class="fa-solid fa-folder-open"></i> المشاريع النشطة</div><div class="num" id="sProjects">0</div></div><div class="stat"><div class="muted"><i class="fa-solid fa-list-check"></i> المهام المفتوحة</div><div class="num" id="sTasks">0</div></div><div class="stat"><div class="muted"><i class="fa-solid fa-file-invoice-dollar"></i> إجمالي الفواتير</div><div class="num" id="sMoney">0</div></div></div></section><div class="tabs"><button class="tab on"><i class="fa-solid fa-house"></i> نظرة عامة</button><button class="tab"><i class="fa-solid fa-users"></i> العملاء</button><button class="tab"><i class="fa-solid fa-folder-open"></i> المشاريع</button><button class="tab"><i class="fa-solid fa-list-check"></i> المهام</button><button class="tab"><i class="fa-solid fa-wallet"></i> المالية</button></div><div class="toolbar"><input id="search" class="search" placeholder="ابحث عن عميل أو مشروع..." oninput="render()"></div><div id="clients" class="clients"></div><div id="error" class="empty error"><i class="fa-solid fa-link-slash" style="font-size:32px;margin-bottom:12px"></i><br>الرابط غير صالح أو انتهت صلاحيته.</div></main>
<script>
var DATA={},TOKEN={}; function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function n(v){return Number(v)||0}function done(x){return x.done===true||['done','completed','مكتمل'].indexOf(String(x.status||'').toLowerCase())>=0}function cid(x){return String(x.client_id||x.clientId||'')}function amount(x){return n(x.total||x.amount||x.value||x.price)}function activeProject(x){return !x.archived&&!done(x)}
function render(){var q=(document.getElementById('search').value||'').trim().toLowerCase(),clients=(DATA.clients||[]).filter(function(c){var ps=(DATA.projects||[]).filter(function(p){return cid(p)===String(c.id)});return !q||String(c.name||c.company||'').toLowerCase().includes(q)||ps.some(function(p){return String(p.name||p.title||'').toLowerCase().includes(q)})});var out=document.getElementById('clients');if(!clients.length){out.innerHTML='<div class="empty">لا توجد نتائج مطابقة</div>';return}out.innerHTML=clients.map(function(c){var ps=(DATA.projects||[]).filter(function(p){return cid(p)===String(c.id)}),pids=ps.map(function(p){return String(p.id)}),ts=[].concat(DATA.tasks||[],DATA.project_tasks||[]).filter(function(t){return cid(t)===String(c.id)||pids.includes(String(t.project_id||t.projectId||''))}),inv=(DATA.invoices||[]).filter(function(i){return cid(i)===String(c.id)||pids.includes(String(i.project_id||''))}),total=inv.reduce(function(a,x){return a+amount(x)},0),paid=inv.filter(function(x){return x.paid===true||['paid','مدفوع','collected'].includes(String(x.status||'').toLowerCase())}).reduce(function(a,x){return a+amount(x)},0);return '<section class="client"><div class="chead" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden"><div class="who"><div class="avatar">'+esc((c.name||c.company||'ع').charAt(0))+'</div><div><b>'+esc(c.name||c.company||'عميل')+'</b><div class="muted" style="font-size:11px">'+esc(c.company||'')+'</div></div></div><span class="pill">'+ps.filter(activeProject).length+' مشروع نشط</span></div><div class="body"><div class="summary"><div class="mini"><span class="muted">المشاريع</span><b>'+ps.length+'</b></div><div class="mini"><span class="muted">المهام المفتوحة</span><b>'+ts.filter(function(x){return !done(x)}).length+'</b></div><div class="mini"><span class="muted">إجمالي الفواتير</span><b>'+total.toLocaleString('ar-EG')+'</b></div><div class="mini"><span class="muted">تم تحصيله</span><b style="color:#4fd1a5">'+paid.toLocaleString('ar-EG')+'</b></div></div><div class="cols"><div class="section"><h3><i class="fa-solid fa-folder-open"></i> المشاريع</h3>'+(ps.length?ps.map(function(p){return '<div class="row"><span>'+esc(p.name||p.title||'مشروع')+'</span><span class="status '+(done(p)?'done':'')+'">'+esc(p.status||(done(p)?'مكتمل':'نشط'))+'</span></div>'}).join(''):'<div class="muted">لا توجد مشاريع</div>')+'</div><div class="section"><h3><i class="fa-solid fa-list-check"></i> أحدث المهام</h3>'+(ts.length?ts.slice(0,8).map(function(t){return '<div class="row"><span>'+esc(t.title||t.name||'مهمة')+'</span><span class="status '+(done(t)?'done':'')+'">'+(done(t)?'مكتمل':esc(t.status||'جديد'))+'</span></div>'}).join(''):'<div class="muted">لا توجد مهام</div>')+'</div></div></div></section>'}).join('')}
(async function(){try{var token=new URLSearchParams(location.search).get('token')||location.pathname.split('/').filter(Boolean).pop();var res=await window.OrdoPublic.resolvePublicToken(window.ordoSupabase,token,{entity_type:'client_portal'});if(!res||!res.ok)throw 0;DATA=res.data||{};TOKEN=res.token||{};if(TOKEN.portal_kind!=='freelancer'&&!(TOKEN.client_ids||[]).length&&!TOKEN.all_clients)throw 0;var st=DATA.settings||{};document.getElementById('studio').textContent=st.studioName||st.studio||st.name||'Ordo';document.getElementById('title').textContent=TOKEN.portal_name||'بوابة متابعة الأعمال';document.title=document.getElementById('title').textContent;var img=st.logoDark||st.logo||st.store_logo;if(img)document.getElementById('logo').innerHTML='<img src="'+esc(img)+'">';var projects=(DATA.projects||[]).filter(activeProject),tasks=[].concat(DATA.tasks||[],DATA.project_tasks||[]).filter(function(x){return !done(x)}),invoices=DATA.invoices||[];document.getElementById('sClients').textContent=(DATA.clients||[]).length;document.getElementById('sProjects').textContent=projects.length;document.getElementById('sTasks').textContent=tasks.length;document.getElementById('sMoney').textContent=invoices.reduce(function(a,x){return a+amount(x)},0).toLocaleString('ar-EG');render()}catch(e){document.getElementById('error').style.display='block';document.getElementById('search').style.display='none'}finally{document.getElementById('loading').remove()}})();
</script></body></html>
