<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ordo — تعذر فتح الصفحة</title>
  <link rel="stylesheet" href="../Assets/vendor/fonts/offline-fonts.css">
  <link rel="stylesheet" href="../Assets/vendor/fontawesome/css/all.min.css">
  <style>
    :root{--bg:#090d1b;--surface:#111a31;--surface2:#17233f;--border:#2a3a5e;--text:#f6f7fb;--muted:#98a6c5;--accent:#f5a000;--green:#4fd1a5;--red:#f76f7c}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 12% 10%,rgba(245,160,0,.16),transparent 27%),radial-gradient(circle at 88% 84%,rgba(124,111,247,.16),transparent 30%),var(--bg);color:var(--text);font-family:Cairo,Tahoma,sans-serif}
    .shell{width:min(920px,100%);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);border:1px solid var(--border);border-radius:28px;overflow:hidden;background:linear-gradient(145deg,rgba(17,26,49,.96),rgba(8,13,27,.96));box-shadow:0 35px 100px rgba(0,0,0,.45)}
    main{padding:54px}.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid rgba(245,160,0,.3);border-radius:999px;background:rgba(245,160,0,.09);color:var(--accent);font-size:11px;font-weight:900}.code{font-size:clamp(72px,13vw,132px);line-height:.9;margin:28px 0 18px;font-weight:1000;letter-spacing:-7px;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}.title{font-size:clamp(24px,4vw,38px);margin:0 0 10px}.desc{color:var(--muted);font-size:14px;line-height:1.9;max-width:560px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);text-decoration:none;font:800 13px Cairo;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#17120a}.btn:hover{transform:translateY(-1px)}
    aside{position:relative;display:grid;place-items:center;min-height:480px;padding:34px;background:linear-gradient(160deg,rgba(245,160,0,.12),rgba(124,111,247,.06));border-inline-start:1px solid var(--border);overflow:hidden}.signal{position:relative;width:210px;height:210px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(245,160,0,.35);background:rgba(245,160,0,.08)}.signal:before,.signal:after{content:"";position:absolute;border:1px solid rgba(245,160,0,.18);border-radius:50%;animation:pulse 2.5s infinite}.signal:before{inset:-28px}.signal:after{inset:-58px;animation-delay:.5s}.signal i{font-size:72px;color:var(--accent);filter:drop-shadow(0 8px 20px rgba(245,160,0,.3))}.status{position:absolute;bottom:26px;right:26px;left:26px;display:flex;gap:9px;align-items:center;justify-content:center;color:var(--muted);font-size:11px}.status b{color:var(--green)}
    @keyframes pulse{0%,100%{transform:scale(.96);opacity:.45}50%{transform:scale(1.05);opacity:1}}@media(max-width:760px){.shell{grid-template-columns:1fr}.shell main{padding:36px 26px}.shell aside{min-height:260px;border-inline-start:0;border-top:1px solid var(--border)}.signal{width:130px;height:130px}.signal i{font-size:48px}.code{letter-spacing:-3px}}
  </style>
</head>
<body>
  <section class="shell" aria-labelledby="error-title">
    <main>
      <span class="eyebrow"><i class="fa-solid fa-shield-halved"></i> صفحة الأعطال الفنية</span>
      <div class="code" id="error-code">404</div>
      <h1 class="title" id="error-title">الصفحة غير موجودة</h1>
      <p class="desc" id="error-desc">الرابط الذي فتحته غير متاح أو تم نقله. يمكنك الرجوع للوحة التحكم أو المحاولة مرة أخرى.</p>
      <div class="actions">
        <a class="btn primary" href="/dashboard"><i class="fa-solid fa-house"></i> لوحة التحكم</a>
        <button class="btn" type="button" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i> إعادة المحاولة</button>
        <button class="btn" type="button" onclick="history.length>1?history.back():location.assign('/')"><i class="fa-solid fa-arrow-right"></i> رجوع</button>
      </div>
    </main>
    <aside aria-hidden="true"><div class="signal"><i class="fa-solid fa-triangle-exclamation"></i></div><div class="status"><b><i class="fa-solid fa-circle"></i></b> Ordo يحافظ على بياناتك أثناء العطل</div></aside>
  </section>
  <script>
    (function(){
      var params=new URLSearchParams(location.search),pathCode=(location.pathname.match(/\/(404|500|502|503|504|505)(?:\/|$)/)||[])[1],code=params.get('code')||pathCode||'404';
      var copy={
        '404':['الصفحة غير موجودة','الرابط الذي فتحته غير متاح أو تم نقله. يمكنك الرجوع للوحة التحكم أو المحاولة مرة أخرى.'],
        '500':['حدث عطل داخل النظام','تعذر إكمال الطلب الآن. بياناتك محفوظة، جرّب إعادة المحاولة بعد لحظات.'],
        '502':['الخدمة لا تستجيب','هناك انقطاع مؤقت في الاتصال بالخدمة. حاول مرة أخرى بعد قليل.'],
        '503':['الخدمة تحت الصيانة','نعمل على استعادة الخدمة. بياناتك محفوظة ويمكنك إعادة المحاولة قريباً.'],
        '504':['انتهت مهلة الاتصال','استغرق الاتصال وقتاً أطول من المتوقع. تحقق من الإنترنت ثم حاول مجدداً.'],
        '505':['إصدار الاتصال غير مدعوم','تعذر إكمال الاتصال بهذه الطريقة. حدّث المتصفح أو ارجع للوحة التحكم.']
      },item=copy[code]||['تعذر إكمال العملية','حدث عطل فني غير متوقع. بياناتك محفوظة، ويمكنك إعادة المحاولة أو الرجوع للوحة التحكم.'];
      document.getElementById('error-code').textContent=code;document.getElementById('error-title').textContent=item[0];document.getElementById('error-desc').textContent=item[1];document.title='Ordo — '+item[0];
    })();
  </script>
</body>
</html>
